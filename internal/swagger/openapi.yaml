openapi: 3.0.3
info:
  title: Trading System API Gateway
  description: >-
    Public REST API of the trading exchange, covering the 5 business groups:
    Treasury & Account, Order Execution, Market Data, Portfolio & PnL, Incentives
    & Fees. Request and response examples are embedded in the component schemas
    and rendered by Swagger UI at /swagger. Authenticate with the X-API-Key
    header; failures return 401 for an unknown key, 403 for a missing permission,
    409 for a duplicate client order id, 429 for rate limiting and 502 when a
    downstream service is unavailable. Error bodies use the ErrorResponse schema.
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - ApiKeyAuth: []
tags:
  - name: Treasury & Account
  - name: Order Execution
  - name: Market Data
  - name: Portfolio & PnL
  - name: Incentives & Fees
  - name: Operations
paths:
  # ---------------------------------------------------------------------------
  # 1. Treasury & Account
  # ---------------------------------------------------------------------------
  /accounts:
    post:
      tags: [Treasury & Account]
      summary: Create a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '200':
          description: Account created with API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'

  /accounts/api-keys:
    post:
      tags: [Treasury & Account]
      summary: Generate an API key for an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: API key generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreated'

  /deposit:
    post:
      tags: [Treasury & Account]
      summary: Deposit cash or virtual stock (requires "trade" permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '200':
          description: Deposit succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /withdraw:
    post:
      tags: [Treasury & Account]
      summary: Withdraw cash or virtual stock (requires "withdraw" permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '200':
          description: Withdrawal succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /balances:
    get:
      tags: [Treasury & Account]
      summary: Read account balances
      responses:
        '200':
          description: Account balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'

  /ledger:
    get:
      tags: [Treasury & Account]
      summary: Read account ledger entries
      responses:
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerResponse'
  # ---------------------------------------------------------------------------
  # 2. Order Execution
  # ---------------------------------------------------------------------------
  /orders:
    post:
      tags: [Order Execution]
      summary: Place an order (requires "trade" permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '200':
          description: Order acceptance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Duplicate client_order_id in flight }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [Order Execution]
      summary: Cancel an order (requires "trade" permission)
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: symbol
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancel result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /orders/bulk-cancel:
    post:
      tags: [Order Execution]
      summary: Cancel all open orders matching filters (requires "trade" permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCancelRequest'
      responses:
        '200':
          description: Number of cancelled orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCancelResponse'

  /orders/modify:
    post:
      tags: [Order Execution]
      summary: Modify an order (atomic cancel-and-replace; requires "trade" permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyOrderRequest'
      responses:
        '200':
          description: Modify result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyOrderResponse'

  /orders/open:
    get:
      tags: [Order Execution]
      summary: List open orders
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Open orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'

  /orders/history:
    get:
      tags: [Order Execution]
      summary: List historical (terminal) orders
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Historical orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'

  /trades:
    get:
      tags: [Order Execution]
      summary: List executed trades for the account
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
        - name: order_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Trades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesResponse'
  # ---------------------------------------------------------------------------
  # 3. Market Data
  # ---------------------------------------------------------------------------
  /ticker:
    get:
      tags: [Market Data]
      summary: Get ticker for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerResponse'

  /book:
    get:
      tags: [Market Data]
      summary: Get L2 order book depth
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Order book snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookResponse'

  /trades-tape:
    get:
      tags: [Market Data]
      summary: Get public (anonymized) recent trade tape
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Trade tape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradesResponse'

  /ohlcv:
    get:
      tags: [Market Data]
      summary: Get OHLCV candles
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: interval
          in: query
          schema: { type: string, default: 1m }
        - name: limit
          in: query
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Candles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OHLCVResponse'

  # ---------------------------------------------------------------------------
  # 4. Portfolio & PnL
  # ---------------------------------------------------------------------------
  /positions:
    get:
      tags: [Portfolio & PnL]
      summary: List positions
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'

  /pnl:
    get:
      tags: [Portfolio & PnL]
      summary: Get realized + unrealized PnL
      responses:
        '200':
          description: PnL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnLResponse'

  /buying-power:
    get:
      tags: [Portfolio & PnL]
      summary: Get buying power
      responses:
        '200':
          description: Buying power
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyingPowerResponse'

  # ---------------------------------------------------------------------------
  # 5. Incentives & Fees
  # ---------------------------------------------------------------------------
  /fee-tiers:
    get:
      tags: [Incentives & Fees]
      summary: Get the account's fee tier
      responses:
        '200':
          description: Fee tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeTier'

  /leaderboard:
    get:
      tags: [Incentives & Fees]
      summary: Get the leaderboard
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'

  /redeem-voucher:
    post:
      tags: [Incentives & Fees]
      summary: Redeem a cash voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemVoucherRequest'
      responses:
        '200':
          description: Redemption result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemVoucherResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /health:
    get:
      tags: [Operations]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /ws:
    get:
      tags: [Market Data]
      summary: Live market-data WebSocket stream
      description: >-
        Upgrade to WebSocket and receive a snapshot followed by ticker, candle
        and trade messages. Query parameters: symbols (comma separated),
        channels (ticker,candle,trade) and api_key.
      security: []
      parameters:
        - name: symbols
          in: query
          schema: { type: string, example: "AAPL,MSFT,TSLA" }
        - name: channels
          in: query
          schema: { type: string, example: "ticker,candle,trade" }
        - name: api_key
          in: query
          schema: { type: string, example: demo-key }
      responses:
        '101':
          description: Switching protocols; subsequent frames are JSON messages
        '400':
          description: Invalid symbols or channels

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key created by POST /accounts or POST /accounts/api-keys.

  responses:
    Unauthorized:
      description: Missing or unknown API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The API key lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Per-IP token bucket exhausted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: A downstream service is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    CreateAccountRequest:
      type: object
      example:
        name: Alice
        email: alice@example.com
      properties:
        name: { type: string }
        email: { type: string }

    CreateApiKeyRequest:
      type: object
      example:
        account_id: 1001
        permissions: [read_only, trade]
      properties:
        account_id: { type: integer, format: int64 }
        permissions:
          type: array
          items: { type: string }

    AccountCreated:
      type: object
      example:
        account_id: 1001
        api_key: 6f1c2a9b7d4e8f03
        secret_key: 9a7b1c2d3e4f5061728394a5b6c7d8e9
        permissions: [read_only, trade, withdraw]
      properties:
        account_id: { type: integer, format: int64 }
        api_key: { type: string }
        secret_key: { type: string }
        permissions:
          type: array
          items: { type: string }

    DepositRequest:
      type: object
      example:
        asset: CASH
        amount: "10000.00"
      properties:
        asset: { type: string }
        amount: { type: string }

    SuccessResponse:
      type: object
      example:
        success: true
      properties:
        success: { type: boolean }

    Balance:
      type: object
      example:
        asset: CASH
        total: "20000.00"
        available: "15000.00"
        frozen: "5000.00"
      properties:
        asset: { type: string }
        total: { type: string }
        available: { type: string }
        frozen: { type: string }

    BalancesResponse:
      type: object
      properties:
        balances:
          type: array
          items: { $ref: '#/components/schemas/Balance' }

    LedgerEntry:
      type: object
      example:
        entry_id: 501
        asset: CASH
        debit: "1501.50"
        credit: "0"
        reference: "trade:10001"
        reason: BUY
        timestamp_ns: 1760000000000000000
      properties:
        entry_id: { type: integer, format: int64 }
        asset: { type: string }
        debit: { type: string }
        credit: { type: string }
        reference: { type: string }
        reason: { type: string }
        timestamp_ns: { type: integer, format: int64 }

    LedgerResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }

    PlaceOrderRequest:
      type: object
      example:
        symbol: AAPL
        side: BUY
        type: LIMIT
        price: "150.00"
        quantity: "10"
        time_in_force: GTC
        client_order_id: demo-1
      required: [symbol, side, type, quantity]
      properties:
        symbol: { type: string }
        side: { type: string, default: BUY }
        type: { type: string, default: LIMIT }
        price: { type: string }
        quantity: { type: string }
        time_in_force: { type: string, default: GTC }
        client_order_id: { type: string }

    Trade:
      type: object
      properties:
        trade_id: { type: integer, format: int64 }
        symbol: { type: string }
        price: { type: string }
        quantity: { type: string }
        maker_order_id: { type: integer, format: int64 }
        taker_order_id: { type: integer, format: int64 }
        maker_account_id: { type: integer, format: int64 }
        taker_account_id: { type: integer, format: int64 }

    OrderResponse:
      type: object
      example:
        accepted: true
        order_id: 42
        status: PARTIALLY_FILLED
        reject_reason: ""
        trades:
          - trade_id: 10001
            symbol: AAPL
            price: "150.00"
            quantity: "4"
            maker_order_id: 7
            taker_order_id: 42
            maker_account_id: 1002
            taker_account_id: 1001
      properties:
        accepted: { type: boolean }
        order_id: { type: integer, format: int64 }
        status: { type: string }
        reject_reason: { type: string }
        trades:
          type: array
          items: { $ref: '#/components/schemas/Trade' }

    BulkCancelRequest:
      type: object
      example:
        symbol: AAPL
        side: BUY
      properties:
        symbol: { type: string }
        side: { type: string }

    BulkCancelResponse:
      type: object
      example:
        cancelled_count: 3
      properties:
        cancelled_count: { type: integer }

    ModifyOrderRequest:
      type: object
      example:
        order_id: 42
        new_price: "151.00"
        new_quantity: "8"
      required: [order_id]
      properties:
        order_id: { type: integer, format: int64 }
        new_price: { type: string }
        new_quantity: { type: string }

    ModifyOrderResponse:
      type: object
      example:
        success: true
        new_order_id: 43
      properties:
        success: { type: boolean }
        new_order_id: { type: integer, format: int64 }
        reason: { type: string }

    OrderView:
      type: object
      example:
        order_id: 42
        symbol: AAPL
        side: BUY
        type: LIMIT
        price: "150.00"
        quantity: "10"
        executed_quantity: "4"
        leaves_quantity: "6"
        status: PARTIALLY_FILLED
        timestamp_ns: 1760000000000000000
      properties:
        order_id: { type: integer, format: int64 }
        symbol: { type: string }
        side: { type: string }
        type: { type: string }
        price: { type: string }
        quantity: { type: string }
        executed_quantity: { type: string }
        leaves_quantity: { type: string }
        status: { type: string }
        timestamp_ns: { type: integer, format: int64 }

    OrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/OrderView' }

    TradeView:
      type: object
      example:
        trade_id: 10001
        order_id: 42
        symbol: AAPL
        price: "150.00"
        quantity: "4"
        fee: "0.60"
        role: TAKER
        timestamp_ns: 1760000000000000000
      properties:
        trade_id: { type: integer, format: int64 }
        order_id: { type: integer, format: int64 }
        symbol: { type: string }
        price: { type: string }
        quantity: { type: string }
        fee: { type: string }
        role: { type: string }
        timestamp_ns: { type: integer, format: int64 }

    TradesResponse:
      type: object
      properties:
        trades:
          type: array
          items: { $ref: '#/components/schemas/TradeView' }

    Ticker:
      type: object
      example:
        symbol: AAPL
        last_price: "150.25"
        best_bid: "150.20"
        best_ask: "150.30"
      properties:
        symbol: { type: string }
        last_price: { type: string }
        best_bid: { type: string }
        best_ask: { type: string }

    TickerResponse:
      type: object
      properties:
        ticker: { $ref: '#/components/schemas/Ticker' }

    OrderBookResponse:
      type: object
      example:
        symbol: AAPL
        bids: [["150.20", "300"], ["150.10", "500"]]
        asks: [["150.30", "250"], ["150.40", "400"]]
      properties:
        symbol: { type: string }
        bids:
          type: array
          items:
            type: array
            items: { type: string }
        asks:
          type: array
          items:
            type: array
            items: { type: string }

    Candle:
      type: object
      example:
        timestamp: 1760000000
        open: 150.0
        high: 151.2
        low: 149.8
        close: 150.9
        volume: 12000
      properties:
        timestamp: { type: integer, format: int64 }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }

    OHLCVResponse:
      type: object
      properties:
        candles:
          type: array
          items: { $ref: '#/components/schemas/Candle' }

    Position:
      type: object
      example:
        symbol: AAPL
        available_quantity: "100"
        pending_quantity: "0"
        average_cost: "148.75"
        market_price: "150.25"
        unrealized_pnl: "150.00"
      properties:
        symbol: { type: string }
        available_quantity: { type: string }
        pending_quantity: { type: string }
        average_cost: { type: string }
        market_price: { type: string }
        unrealized_pnl: { type: string }

    PositionsResponse:
      type: object
      properties:
        positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }

    PnLResponse:
      type: object
      example:
        realized_pnl: "320.50"
        unrealized_pnl: "150.00"
      properties:
        realized_pnl: { type: string }
        unrealized_pnl: { type: string }

    BuyingPowerResponse:
      type: object
      example:
        cash_balance: 15000.0
        margin: 0.0
        buying_power: 15000.0
        margin_ratio: 0.0
      properties:
        cash_balance: { type: number }
        margin: { type: number }
        buying_power: { type: number }
        margin_ratio: { type: number }

    FeeTier:
      type: object
      example:
        volume_30d: "5000000"
        current_tier: VIP1
        maker_fee: "0.0004"
        taker_fee: "0.0008"
      properties:
        volume_30d: { type: string }
        current_tier: { type: string }
        maker_fee: { type: string }
        taker_fee: { type: string }

    LeaderboardEntry:
      type: object
      example:
        account_id: 1001
        name: bot-alpha
        roi: "0.12"
        volume: "12000000"
        rank: 1
      properties:
        account_id: { type: integer, format: int64 }
        name: { type: string }
        roi: { type: string }
        volume: { type: string }
        rank: { type: integer }

    LeaderboardResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardEntry' }

    RedeemVoucherRequest:
      type: object
      example:
        voucher_code: WELCOME50
      properties:
        voucher_code: { type: string }

    RedeemVoucherResponse:
      type: object
      example:
        success: true
        reason: ""
        credited_amount: "50000"
      properties:
        success: { type: boolean }
        reason: { type: string }
        credited_amount: { type: string }

    ErrorResponse:
      type: object
      example:
        error: unauthorized
      properties:
        error: { type: string }
