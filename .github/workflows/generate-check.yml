name: Generate Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Regenerate code from OpenAPI spec
        run: go generate ./...

      - name: Verify generated code has no drift
        run: git diff --exit-code

      - name: Build
        run: go build ./...
